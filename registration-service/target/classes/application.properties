spring.application.name=registration-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/registration_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Internal service URLs
course-service.base-url=http://localhost:8082

# JWT
jwt.secret=MySecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!
